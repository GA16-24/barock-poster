<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.render = async ({ url, times, view, width, height, focus = [0, 0] }) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#d8d2c8');
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.7;
  const sun = new THREE.DirectionalLight('#fff4e0', 2.4);
  sun.position.set(-0.7, 1.2, 0.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -0.6, right: 0.6, top: 0.6, bottom: -0.6, near: 0.1, far: 4 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.0015;
  scene.add(sun);

  const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(url);
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene);
  for (const clip of gltf.animations) mixer.clipAction(clip).play();

  let camera;
  if (view === 'top') {
    camera = new THREE.OrthographicCamera(-0.52, 0.52, 0.52 * height / width, -0.52 * height / width, 0.01, 10);
    camera.position.set(0, 3, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
  } else {
    const close = view === 'close';
    const [d, el, az, fov, ty] = close ? [0.42, 34, 10, 30, 0.06] : [1.55, 38, 0, 32, 0.03];
    const [cx, cz] = close ? [focus[0] * 0.477, -focus[1] * 0.477] : [0, 0];
    camera = new THREE.PerspectiveCamera(fov, width / height, 0.01, 10);
    const e = (el * Math.PI) / 180, a = (az * Math.PI) / 180;
    camera.position.set(cx + Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d + ty, cz + Math.cos(a) * Math.cos(e) * d);
    camera.lookAt(cx, ty, cz);
  }
  const shots = [];
  for (const t of times) {
    mixer.setTime(t);
    renderer.render(scene, camera);
    shots.push(renderer.domElement.toDataURL('image/png'));
  }
  return { shots, clips: gltf.animations.map((c) => [c.name, c.duration, c.tracks.length]) };
};
window.ready = true;
</script>
