<!doctype html>
<meta charset="utf-8">
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<body style="margin:0;background:#222">
<canvas id="out"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

// rows: [{ label, url, angles: [deg] }] -> one PNG data URL, one row per model, one tile per angle.
window.renderSheet = async (rows, tile = 256, title = '') => {
  const cols = Math.max(...rows.map((r) => r.angles.length));
  const labelW = 150, head = title ? 34 : 0;
  const out = document.getElementById('out');
  out.width = labelW + cols * tile; out.height = head + rows.length * tile;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 0, out.width, out.height);
  if (title) { ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.fillText(title, 10, 24); }

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(tile, tile);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8c8c8c);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(1, 2, 2);
  scene.add(sun);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
  const report = [];

  for (const [i, row] of rows.entries()) {
    const y = head + i * tile;
    ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif';
    ctx.fillText(row.label, 8, y + 22);
    let gltf;
    try { gltf = await loader.loadAsync(row.url); } catch (err) {
      ctx.fillStyle = '#f66'; ctx.fillText('FEHLT', 8, y + 44); report.push({ url: row.url, error: String(err) }); continue;
    }
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    report.push({ url: row.url, size: size.toArray().map((v) => +v.toFixed(3)), center: c.toArray().map((v) => +v.toFixed(3)) });
    ctx.fillStyle = '#bbb'; ctx.font = '12px sans-serif';
    ctx.fillText(size.toArray().map((v) => v.toFixed(2)).join(' x '), 8, y + 42);
    scene.add(gltf.scene);
    const r = 0.5 * size.length();
    const d = r / Math.sin(THREE.MathUtils.degToRad(15)) * 0.95;
    for (const [k, deg] of row.angles.entries()) {
      const a = THREE.MathUtils.degToRad(deg);
      camera.position.set(c.x + Math.sin(a) * d * 0.97, c.y + d * 0.22, c.z + Math.cos(a) * d * 0.97);
      camera.lookAt(c);
      renderer.render(scene, camera);
      ctx.drawImage(renderer.domElement, labelW + k * tile, y);
      ctx.fillStyle = '#ff0'; ctx.font = '12px sans-serif';
      ctx.fillText(`${deg}°`, labelW + k * tile + 4, y + tile - 6);
    }
    scene.remove(gltf.scene);
  }
  renderer.dispose();
  return { png: out.toDataURL('image/png'), report };
};
window.ready = true;
</script>
